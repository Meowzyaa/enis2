name: CI

# Render deploys trunk with no build gate of its own, so this is the only
# check that catches Linux-only build breaks before they hit production.
on:
  push:
    branches: [trunk, modernization]
  pull_request:
    branches: [trunk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn build

      - run: yarn typecheck
